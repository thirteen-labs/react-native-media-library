# Per-module Gradle settings for @obsidian_north/react-native-mediastore
#
# NOTE: Library modules are consumed by a host app. Global build-speed knobs
# (org.gradle.parallel, org.gradle.configuration-cache, org.gradle.daemon)
# are read from the ROOT project's gradle.properties, not this file. Add those
# to your app's android/gradle.properties for maximum effect. The settings here
# apply to this module directly (standalone aar builds / CI) and are harmless
# when ignored by the root build.

# Give the Gradle/Kotlin daemons more heap to avoid GC thrash on large metadata builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Reuse task outputs across builds (and across machines if a remote cache is configured)
org.gradle.caching=true

# Incremental Kotlin compilation (avoids recompiling unchanged sources)
kotlin.incremental=true

# Use AndroidX artifacts
android.useAndroidX=true
